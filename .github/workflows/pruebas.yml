name: Pruebas

# Corre la suite completa en cada Pull Request y en cada push a main.
#
# Es el complemento de `desplegar.yml`: aquel publica, este comprueba. No se
# gatilla el despliegue desde aquí a propósito — el deploy ya se auto-verifica
# tras publicar (salud + humo de conteo ciego), y encadenar un E2E con Docker
# por delante de producción dejaría que un fallo intermitente bloquee una
# publicación manual. Si en algún momento se quiere "no fusionar en rojo", eso
# se resuelve con una regla de protección de rama sobre estos checks, no
# reescribiendo el flujo de despliegue.
#
# Ningún job usa secretos: Postgres es un servicio local y el E2E levanta el
# stack con `docker compose` y sus valores por defecto. Así corre limpio en
# forks y en PRs de terceros.

on:
  pull_request:
  push:
    branches: [main]
  workflow_dispatch:

concurrency:
  # Un PR que recibe varios push seguidos solo necesita probar el último.
  group: pruebas-${{ github.ref }}
  cancel-in-progress: true

jobs:
  nucleo:
    name: Núcleo + web (unitarias)
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: pnpm/action-setup@v4
        with:
          version: 11

      - uses: actions/setup-node@v4
        with:
          node-version: 24
          cache: pnpm
          cache-dependency-path: app/pnpm-lock.yaml

      - name: Instalar dependencias
        working-directory: app
        run: pnpm install --frozen-lockfile

      - name: Núcleo — cobertura (>95% en líneas)
        working-directory: app
        run: pnpm --filter @conteo/core test:cobertura

      - name: Web — unitarias
        working-directory: app
        run: pnpm --filter web test

  api:
    name: API (Postgres real, conteo ciego)
    runs-on: ubuntu-latest

    services:
      postgres:
        image: postgres:18-alpine
        env:
          POSTGRES_USER: conteo
          POSTGRES_PASSWORD: conteo_local_dev
          POSTGRES_DB: conteo
        ports:
          - 5432:5432
        options: >-
          --health-cmd "pg_isready -U conteo -d conteo"
          --health-interval 3s
          --health-timeout 3s
          --health-retries 20

    env:
      DATABASE_URL: postgresql://conteo:conteo_local_dev@localhost:5432/conteo?schema=public

    steps:
      - uses: actions/checkout@v4

      - uses: pnpm/action-setup@v4
        with:
          version: 11

      - uses: actions/setup-node@v4
        with:
          node-version: 24
          cache: pnpm
          cache-dependency-path: app/pnpm-lock.yaml

      - name: Instalar dependencias
        working-directory: app
        run: pnpm install --frozen-lockfile

      - name: Preparar la base (generar + migrar + sembrar)
        working-directory: app
        # El seed lee datos/BODEGAS Y STOCK.xlsx por su ruta por defecto, que
        # está versionada en el repo. La prueba de conteo ciego necesita datos
        # reales: recorre las rutas con inject() y falla si `sd` se filtra.
        run: pnpm --filter api prepare:db

      - name: API — el conteo es ciego
        working-directory: app
        run: pnpm --filter api test

  e2e:
    name: E2E (stack completo con Docker)
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: pnpm/action-setup@v4
        with:
          version: 11

      - uses: actions/setup-node@v4
        with:
          node-version: 24
          cache: pnpm
          cache-dependency-path: app/pnpm-lock.yaml

      - name: Instalar dependencias
        working-directory: app
        run: pnpm install --frozen-lockfile

      - name: Levantar el stack (Postgres + API + Web + Caddy)
        working-directory: app
        # Sin .env: docker-compose.yml trae valores por defecto para todo. La
        # API siembra la base al arrancar, así que no escucha hasta tener datos.
        run: docker compose up --build -d

      - name: Esperar a que la API responda (incluye el seed)
        # /salud sale por Caddy como https://localhost/api/salud. Que devuelva
        # 200 implica que la migración y el seed ya terminaron: el servidor no
        # escucha antes. Sembrar el xlsx de 442KB en frío tarda; damos margen.
        run: |
          for i in $(seq 1 60); do
            code=$(curl -sk -o /dev/null -w '%{http_code}' https://localhost/api/salud || true)
            echo "  intento $i · /api/salud → $code"
            [ "$code" = "200" ] && exit 0
            sleep 5
          done
          echo "La API no respondió a tiempo. Logs:"
          docker compose logs --tail 80
          exit 1

      - name: Instalar navegador de Playwright
        working-directory: app
        run: pnpm --filter web exec playwright install --with-deps chromium

      - name: E2E — ingreso y ciclo de conteo
        working-directory: app
        # Contra Caddy por HTTPS (modo por defecto): ignoreHTTPSErrors ya acepta
        # el certificado local. No se usa PLAYWRIGHT_DIRECT.
        env:
          PLAYWRIGHT_BASE: https://localhost
        run: pnpm --filter web test:e2e

      - name: Guardar el reporte si algo falla
        if: failure()
        uses: actions/upload-artifact@v4
        with:
          name: playwright-report
          path: |
            app/apps/web/playwright-report
            app/apps/web/test-results
          retention-days: 7
          if-no-files-found: ignore

      - name: Apagar el stack
        if: always()
        working-directory: app
        run: docker compose down -v
